<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vimana" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Vimana — Boarding House Expense &amp; Cleaning Manager</title>
    <meta
      name="description"
      content="Vimana is a simple web app for boarding houses to split food, electricity, water, and monthly bills fairly, confirm payments, and manage cleaning turns."
    />

    <!-- Canonical & Link preview card (Google, WhatsApp, Facebook) -->
    <link rel="canonical" href="https://vimana.site/" />
    <meta property="og:site_name" content="Vimana" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vimana.site/" />
    <meta property="og:title" content="Vimana — Boarding House Expense & Cleaning Manager" />
    <meta
      property="og:description"
      content="Vimana helps boarding houses split food and bills fairly, confirm payments, and rotate cleaning duties."
    />
    <meta property="og:image" content="https://vimana.site/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured Data (tells Google your brand name is "Vimana") -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Vimana",
            "alternateName": "Vimana Boarding",
            "url": "https://vimana.site/"
          },
          {
            "@type": "WebApplication",
            "name": "Vimana",
            "url": "https://vimana.site/",
            "applicationCategory": "LifestyleApplication",
            "operatingSystem": "All",
            "description": "Vimana is a mobile-friendly boarding house management web app for fair expense splits, two-party payment confirmation, and group cleaning rotations."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Vimana — Boarding House Expense &amp; Cleaning Manager (https://vimana.site). Please enable
      JavaScript to use the app.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
